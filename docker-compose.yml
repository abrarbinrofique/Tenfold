services:
  api:
    build: ./backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Supabase (Tokyo pooler, session mode :5432). Password URL-encoded: ! -> %21, % -> %25
      DATABASE_URL: "postgresql+asyncpg://postgres.ghcgsaabejlgrtxeihuo:Qwe32211%21%256@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres"
      APP_NOW: "2026-11-11T15:00:00Z"
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGIN: http://localhost:3000
      SEED_PATH: /app/seed.json
    volumes:
      - ./backend:/app
      - ./seed.json:/app/seed.json:ro
    ports: ["8000:8000"]
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
